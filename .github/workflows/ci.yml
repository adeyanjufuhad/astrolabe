name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  # Builds every release binary without publishing, so a broken .goreleaser.yaml
  # fails here instead of on release day.
  release-snapshot:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean
      - name: Smoke-test the Linux binary
        run: |
          bin=$(find dist -path '*linux_amd64*' -name astrolabe -type f | head -n 1)
          "$bin" version
          "$bin" version | grep -q -- '-next$' # stamped with the snapshot version, not "dev" or a released tag
          ls dist/*.tar.gz dist/*.zip dist/checksums.txt

  # Runs the action from this repo against the demo page, which has drift on purpose.
  demo:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - id: astrolabe
        uses: ./
        with:
          urls: examples/checkout/index.html
          tokens: examples/checkout/tokens.json
          comment: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      - run: echo "Demo fidelity ${{ steps.astrolabe.outputs.score }}%"

  # The landing page (Next.js, static export) is built and then held to its own
  # design tokens (site/tokens.json). .demo areas show drift on purpose, so they're skipped.
  site:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the landing page
        working-directory: site
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Serve the landing page
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory site/out > /dev/null 2>&1 &
          for i in $(seq 20); do curl -sf http://127.0.0.1:8765/ > /dev/null && break; sleep 0.5; done
      - name: Check desktop
        run: go run ./cmd/astrolabe check http://127.0.0.1:8765/ --tokens site/tokens.json --ignore .demo --wait 1500ms --fail-under 100
      - name: Check mobile
        run: go run ./cmd/astrolabe check http://127.0.0.1:8765/ --tokens site/tokens.json --ignore .demo --wait 1500ms --fail-under 100 --viewport 390x844
