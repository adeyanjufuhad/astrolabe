name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  # Runs the action from this repo against the demo page, which has drift on purpose.
  demo:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - id: astrolabe
        uses: ./
        with:
          urls: examples/checkout/index.html
          tokens: examples/checkout/tokens.json
          comment: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      - run: echo "Demo fidelity ${{ steps.astrolabe.outputs.score }}%"
