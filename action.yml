name: Astrolabe design drift check
description: Audit pages against your design tokens and comment the results on the pull request.
author: adeyanjufuhad
branding:
  icon: compass
  color: green

inputs:
  urls:
    description: Pages to audit (URLs or HTML files), separated by spaces or new lines.
    required: true
  tokens:
    description: Path to your design token JSON file.
    default: tokens.json
  fail-under:
    description: Fail the job if fidelity (percent of values on-token) is below this. 0 never fails.
    default: "0"
  ignore:
    description: Comma-separated CSS selectors to skip (e.g. ".ads,#cookie-banner").
    default: ""
  viewport:
    description: Viewport size WIDTHxHEIGHT.
    default: 1280x800
  comment:
    description: Post (and keep updating) a summary comment on the pull request.
    default: "true"
  server:
    description: Optional Astrolabe server URL to store scan history in.
    default: ""
  api-key:
    description: API key for the history server (use a secret).
    default: ""
  project:
    description: Project name for the history server. Defaults to the repository name.
    default: ""
  baseline:
    description: >-
      Earlier JSON report to compare with, so the comment leads with the drift this change introduces.
      "auto" downloads the report from the latest run of this workflow on the pull request's base branch
      (needs `actions: read` and the workflow to also run on pushes to that branch); a file path uses that
      report; "none" turns comparison off.
    default: auto
  fail-on-new:
    description: Fail the job if the change adds an off-token value or uses an existing one on more elements. Needs a baseline.
    default: "false"
  artifact-name:
    description: Name of the uploaded artifact (HTML and JSON report). "auto" baselines look for this name.
    default: astrolabe-report
  github-token:
    description: Token used to comment on the pull request and to download the baseline report.
    default: ${{ github.token }}

outputs:
  score:
    description: Overall fidelity percentage.
    value: ${{ steps.check.outputs.score }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version: "1.24"
        cache: false

    - name: Build Astrolabe
      shell: bash
      run: cd "$GITHUB_ACTION_PATH" && go build -trimpath -o "$RUNNER_TEMP/astrolabe" ./cmd/astrolabe

    - name: Find baseline report
      id: baseline
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        ARTIFACT: ${{ inputs.artifact-name }}
      run: |
        case "$INPUT_BASELINE" in
          none|"") exit 0 ;;
          auto) ;;
          *) echo "path=$INPUT_BASELINE" >> "$GITHUB_OUTPUT"; exit 0 ;;
        esac
        if [ -z "$GITHUB_BASE_REF" ]; then
          echo "Not a pull request, so there is nothing to compare with."
          exit 0
        fi
        # This workflow's file (".github/workflows/ci.yml@refs/pull/7/merge" -> "ci.yml").
        workflow="${GITHUB_WORKFLOW_REF%@*}"
        workflow="${workflow##*/}"
        dir="$RUNNER_TEMP/astrolabe-baseline"
        # The newest push run on the base branch that uploaded a JSON report.
        for run in $(gh run list -R "$GITHUB_REPOSITORY" --workflow "$workflow" --branch "$GITHUB_BASE_REF" \
                       --event push --limit 10 --json databaseId,status --jq '.[] | select(.status == "completed") | .databaseId'); do
          rm -rf "$dir"
          if gh run download "$run" -R "$GITHUB_REPOSITORY" -n "$ARTIFACT" -D "$dir" > /dev/null 2>&1 && [ -f "$dir/astrolabe.json" ]; then
            echo "Comparing with the report from run $run on $GITHUB_BASE_REF."
            echo "path=$dir/astrolabe.json" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        done
        echo "::notice title=Astrolabe::No baseline report found on $GITHUB_BASE_REF yet, so every off-token value is listed. Run this workflow on pushes to $GITHUB_BASE_REF to compare future pull requests."

    - name: Check pages
      id: check
      shell: bash
      env:
        INPUT_URLS: ${{ inputs.urls }}
        INPUT_TOKENS: ${{ inputs.tokens }}
        INPUT_FAIL_UNDER: ${{ inputs.fail-under }}
        INPUT_IGNORE: ${{ inputs.ignore }}
        INPUT_VIEWPORT: ${{ inputs.viewport }}
        INPUT_SERVER: ${{ inputs.server }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_FAIL_ON_NEW: ${{ inputs.fail-on-new }}
        BASELINE: ${{ steps.baseline.outputs.path }}
        ASTROLABE_API_KEY: ${{ inputs.api-key }}
      run: |
        set +e
        read -ra URLS <<< "$(printf '%s' "$INPUT_URLS" | tr '\n' ' ')"
        out="$RUNNER_TEMP/astrolabe"
        args=(check "${URLS[@]}" --tokens "$INPUT_TOKENS" --viewport "$INPUT_VIEWPORT" --fail-under "$INPUT_FAIL_UNDER"
              --json "$out.json" --html "$out-report.html" --markdown "$out.md" --no-color)
        if [ -n "$BASELINE" ]; then
          args+=(--baseline "$BASELINE")
          [ "$INPUT_FAIL_ON_NEW" = "true" ] && args+=(--fail-on-new)
        elif [ "$INPUT_FAIL_ON_NEW" = "true" ]; then
          echo "::warning title=Astrolabe::fail-on-new is set but there is no baseline to compare with, so it was skipped."
        fi
        [ -n "$INPUT_IGNORE" ] && args+=(--ignore "$INPUT_IGNORE")
        [ -n "$INPUT_SERVER" ] && args+=(--upload "$INPUT_SERVER")
        [ -n "$INPUT_PROJECT" ] && args+=(--project "$INPUT_PROJECT")
        "$RUNNER_TEMP/astrolabe" "${args[@]}"
        code=$?
        [ -f "$out.md" ] && cat "$out.md" >> "$GITHUB_STEP_SUMMARY"
        echo "score=$(jq -r '.score // empty' "$out.json" 2>/dev/null)" >> "$GITHUB_OUTPUT"
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        exit 0 # report first, enforce the threshold in the last step

    # The JSON report doubles as the baseline for later pull requests.
    - name: Upload report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ runner.temp }}/astrolabe-report.html
          ${{ runner.temp }}/astrolabe.json
        if-no-files-found: ignore

    - name: Comment on pull request
      if: inputs.comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        ARTIFACT: ${{ inputs.artifact-name }}
      run: |
        body="$RUNNER_TEMP/astrolabe.md"
        [ -f "$body" ] || exit 0
        echo "" >> "$body"
        echo "<sub>[Full HTML report](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) (artifact: ${ARTIFACT})</sub>" >> "$body"
        # Update our previous comment instead of adding a new one on every push.
        id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
              --jq '.[] | select(.body | startswith("<!-- astrolabe-report -->")) | .id' | tail -n 1)
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$body" > /dev/null
        else
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$body"
        fi

    - name: Enforce fidelity threshold
      shell: bash
      run: exit ${{ steps.check.outputs.exit-code }}
