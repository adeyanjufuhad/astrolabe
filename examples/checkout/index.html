<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Checkout · Demo Shop</title>
<!--
  Demo page for Astrolabe. It mostly follows tokens.json, but a few values
  drifted the way they do in real codebases. Run:
    astrolabe check examples/checkout/index.html --tokens examples/checkout/tokens.json
-->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, system-ui, sans-serif; color: #111827; background: #f9fafb; }
  h1, h2, p, ul { margin: 0; }
  .shell { max-width: 960px; margin: 0 auto; padding: 48px 24px; display: grid; grid-template-columns: 1fr 360px; gap: 32px; }
  h1 { font-size: 24px; font-weight: 600; margin-bottom: 24px; }
  .card { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 24px; }
  .field { display: grid; gap: 8px; margin-bottom: 16px; }
  label { font-size: 14px; font-weight: 500; color: #111827; }
  input { font: inherit; font-size: 16px; padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .hint { font-size: 12px; color: #6b7280; }

  /* Drift: summary card padding typed by hand */
  .order-summary { padding: 13px; }
  .line { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; }
  .line.total { border-top: 1px solid #e5e7eb; margin-top: 8px; padding-top: 16px; font-weight: 600; font-size: 16px; }

  /* Drift: primary color is one step off (#3b82f7, not #3b82f6) */
  .pay-button { width: 100%; margin-top: 24px; padding: 12px 16px; border: 0; border-radius: 8px;
                background: #3b82f7; color: #ffffff; font-size: 16px; font-weight: 600; }

  /* Drift: promo note uses 15px and an off-palette orange */
  .promo-note { margin-top: 12px; font-size: 15px; color: #6b7280; }

  .badge { display: inline-block; padding: 4px 8px; border-radius: 9999px; background: #16a34a; color: #ffffff; font-size: 12px; font-weight: 500; }

  /* Drift: a legacy font and a 700 weight sneaked into the footer */
  .legal { grid-column: 1 / -1; font-family: Georgia, serif; font-size: 12px; color: #6b7280; }
  .legal strong { font-weight: 700; }
.pay-button { border: 2px solid #7c3aed; }
</style>
</head>
<body>
  <main class="shell">
    <section>
      <h1>Checkout</h1>
      <div class="card">
        <div class="field"><label for="email">Email</label><input id="email" value="mira@example.com"></div>
        <div class="field"><label for="card">Card number</label><input id="card" value="4242 4242 4242 4242"></div>
        <div class="row">
          <div class="field"><label for="exp">Expiry</label><input id="exp" value="12 / 28"></div>
          <div class="field"><label for="cvc">CVC</label><input id="cvc" value="123"></div>
        </div>
        <p class="hint">Payments are encrypted end to end.</p>
      </div>
    </section>

    <aside class="card order-summary">
      <h2 class="line">Order summary <span class="badge">Free shipping</span></h2>
      <div class="line"><span>Orbit lamp</span><span>$89.00</span></div>
      <div class="line"><span>Star map print</span><span>$24.00</span></div>
      <div class="line total"><span>Total</span><span>$113.00</span></div>
      <button class="pay-button">Pay $113.00</button>
      <p class="promo-note">Use code ASTRO for 10% off your next order.</p>
    </aside>

    <p class="legal"><strong>Demo Shop</strong> is a fictional store used to demonstrate Astrolabe.</p>
  </main>
</body>
</html>
